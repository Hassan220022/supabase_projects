<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Studio Login - {{ project.name }}</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main class="login-page">
      <section class="login-panel">
        <div class="brand-mark">S</div>
        <p class="eyebrow">{{ project.slug }}</p>
        <h1>Studio login</h1>
        <p>Sign in to open this project&apos;s Supabase Studio.</p>
        {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
        <form method="post" action="/projects/{{ project.slug }}/studio-login" class="login-form">
          <label>Username
            <input name="username" autocomplete="username" required autofocus>
          </label>
          <label>Password
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit">Open Studio</button>
        </form>
        <p class="login-foot"><a href="/projects/{{ project.slug }}">Back to project</a></p>
      </section>
    </main>
  </body>
</html>
